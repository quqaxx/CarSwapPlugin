name: Build CarSwapPlugin

on:
  push:
  workflow_dispatch:
    inputs:
      assettoserver_ref:
        description: "AssettoServer tag/branch (bos birakirsan ASSETTOSERVER_REF varsayilani kullanilir)"
        required: false
        default: ""

env:
  # Sunucun 0.0.55 preview 44: GitHub'da verdigin commit
  ASSETTOSERVER_REF: "1365f3e75f9b2b0f2f5f72a5954b30ca0801be2c"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Plugin kodunu al
        uses: actions/checkout@v4
        with:
          path: plugin-repo

      - name: AssettoServer kaynagini al
        uses: actions/checkout@v4
        with:
          repository: compujuckel/AssettoServer
          ref: ${{ inputs.assettoserver_ref != '' && inputs.assettoserver_ref || env.ASSETTOSERVER_REF }}
          path: AssettoServer

      - name: .NET 11 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Depodaki dosyalari goster
        run: find plugin-repo -not -path "*/.git/*" -type f

      - name: Plugini AssettoServer/Plugins icine koy
        run: |
          CSPROJ=$(find plugin-repo -name "CarSwapPlugin.csproj" -not -path "*/.git/*" | head -n 1)
          if [ -z "$CSPROJ" ]; then
            echo "CarSwapPlugin.csproj depoda bulunamadi. Yukaridaki dosya listesine bak."
            exit 1
          fi
          SRC=$(dirname "$CSPROJ")
          echo "Plugin klasoru: $SRC"
          mkdir -p AssettoServer/Plugins/CarSwapPlugin
          cp -r "$SRC"/. AssettoServer/Plugins/CarSwapPlugin/

      - name: Derle
        working-directory: AssettoServer
        run: dotnet build Plugins/CarSwapPlugin/CarSwapPlugin.csproj -c Release -o ../out/CarSwapPlugin

      - name: Cikti icerigini goster
        run: find out -type f

      - name: Derlenmis plugini yukle
        uses: actions/upload-artifact@v4
        with:
          name: CarSwapPlugin
          path: out/CarSwapPlugin
